*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% -10%,#202958 0,#0d1220 35%,var(--bg) 68%);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--text)}body{min-height:100dvh;padding:max(16px,env(safe-area-inset-top)) 16px max(18px,env(safe-area-inset-bottom));overscroll-behavior:none}.app{width:min(600px,100%);margin:auto}.brand{display:flex;align-items:center;justify-content:space-between;margin:2px 2px 18px}.brand h1{font-size:1.12rem;margin:0;letter-spacing:.2px}.logo{display:flex;gap:10px;align-items:center}.mark{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),#9e83ff);box-shadow:0 10px 26px rgba(124,92,255,.35);font-weight:900}.icon-btn{border:1px solid var(--line);background:rgba(25,34,56,.72);color:var(--text);min-width:44px;height:44px;border-radius:14px;font-size:1.15rem;cursor:pointer}.card{background:linear-gradient(180deg,rgba(25,34,56,.96),rgba(15,21,35,.98));border:1px solid rgba(119,132,164,.18);border-radius:24px;padding:22px;box-shadow:var(--shadow)}.screen{display:none}.screen.active{display:block;animation:in .22s ease-out}@keyframes in{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}h2{margin:0 0 7px;font-size:1.5rem}.sub{color:var(--muted);margin:0 0 22px;line-height:1.5}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:8px}.field label{font-size:.82rem;color:var(--muted);font-weight:700}.field input{width:100%;font:inherit;font-size:1.05rem;color:var(--text);background:#0c1220;border:1px solid var(--line);border-radius:14px;padding:14px;outline:none}.field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,92,255,.16)}.modes{display:grid;gap:10px;margin:18px 0}.mode{position:relative}.mode input{position:absolute;opacity:0}.mode label{display:fle function loadStats(){try{const x=JSON.parse(localStorage.getItem(KEY));return x&&typeof x==='object'?x:{words:{},total:0,correct:0,wrong:0}}catch{return {words:{},total:0,correct:0,wrong:0}}}
let stats=loadStats(); stats.words=stats.words||{}; stats.total=+stats.total||0; stats.correct=+stats.correct||0; stats.wrong=+stats.wrong||0;
function saveStats(){localStorage.setItem(KEY,JSON.stringify(stats))}
function rec(id){return stats.words[id]||(stats.words[id]={correct:0,wrong:0})}
function show(name){document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('active',x.id===name));window.scrollTo({top:0,behavior:'smooth'})}
function selectedMode(){return document.querySelector('input[name=mode]:checked').value}
function weightedPick(items){let sum=0, weights=items.map(w=>{const r=stats.words[w.id]||{correct:0,wrong:0};const attempts=r.correct+r.wrong;const errorRate=attempts?r.wrong/attempts:.5;const weight=.35+(r.wrong*2.25)+(errorRate*3.2)/(1+r.correct*.18);sum+=weight;return weight});let n=Math.random()*sum;for(let i=0;i<items.length;i++){n-=weights[i];if(n<=0)return items[i]}return items[items.length-1]}
function start(){const s=Number(el('startUnit').value),e=Number(el('endUnit').value),mode=selectedMode();el('homeError').textContent='';if(!Number.isInteger(s)||!Number.isInteger(e)||s>e||s<minUnit||e>maxUnit){el('homeError').textContent=`${minUnit} ile ${maxUnit} arasında geçerli bir aralık seçin.`;return}let pool=WORDS.filter(w=>w.unit>=s&&w.unit<=e);if(mode==='wrong')pool=pool.filter(w=>(stats.words[w.id]?.wrong||0)>0);const distinct=new Set(pool.map(w=>w.french.trim().toLocaleLowerCase('fr')));if(pool.length<3||distinct.size<3){el('homeError').textContent=mode==='wrong'?'Bu aralıkta en az 3 farklı yanlış kelime bulunmalı.':'Bu aralıkta en az 3 farklı Fransızca cevap bulunmalı.';return}localStorage.setItem(PREF,JSON.stringify({s,e,mode}));app.pool=pool;app.sessionTotal=0;app.sessionCorrect=0;app.answered.clear();el('quizMeta').textContent=`Ünite ${s}–${e}`;show('quiz');nextQuestion()}
function getOptions(word){const norm=s=>s.trim().toLocaleLowerCase('fr');const used=new Set([norm(word.french)]), choices=[word];let candidates=app.pool.filter(w=>!used.has(norm(w.french)));for(let i=candidates.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[candidates[i],candidates[j]]=[candidates[j],candidates[i]]}for(const w of candidates){const n=norm(w.french);if(!used.has(n)){used.add(n);choices.push(w);if(choices.length===3)break}}for(let i=choices.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[choices[i],choices[j]]=[choices[j],choices[i]]}return choices}
function nextQuestion(){app.locked=false;el('feedback').textContent='';el('feedback').className='feedback';let candidates=app.pool.length>1?app.pool.filter(w=>!app.current||w.id!==app.current.id):app.pool;app.current=weightedPick(candidates);el('question').textContent=app.current.turkish;const opts=getOptions(app.current);el('options').innerHTML='';opts.forEach((w,i)=>{const b=document.createElement('button');b.className='option';b.dataset.id=w.id;b.innerHTML=`<span class="letter">${String.fromCharCode(65+i)}</span><span></span>`;b.lastElementChild.textContent=w.french;b.addEventListener('click',()=>answer(b,w.id===app.current.id));el('options').appendChild(b)});updateSession()}
function answer(button,isCorrect){if(app.locked)return;app.locked=true;app.sessionTotal++;stats.total++;const r=rec(String(app.current.id));app.answered.add(app.current.id);document.querySelectorAll('.option').forEach(b=>b.disabled=true);if(isCorrect){app.sessionCorrect++;stats.correct++;r.correct++;button.classList.add('correct');el('feedback').textContent='Doğru!';el('feedback').classList.add('good')}else{stats.wrong++;r.wrong++;button.classList.add('wrong');const correctBtn=[...document.querySelectorAll('.option')].find(b=>Number(b.dataset.id)===app.current.id);if(correctBtn)correctBtn.classList.add('correct');el('feedback').textContent=`Doğru cevap: ${app.current.french}`;el('feedback').classList.add('bad')}saveStats();updateSession();setTimeout(nextQuestion,1050)}
function updateSession(){el('sessionScore').textContent=`${app.sessionCorrect} / ${app.sessionTotal}`;const pct=app.pool.length?Math.min(100,app.answered.size/app.pool.length*100):0;el('progressBar').style.width=pct+'%'}
function renderStats(){const total=stats.total,rate=total?Math.round(stats.correct/total*100):0, studied=Object.values(stats.words).filter(r=>(r.correct||0)+(r.wrong||0)>0).length, wrongPool=Object.values(stats.words).filter(r=>(r.wrong||0)>0).length;const items=[['Toplam Cevap',total],['Toplam Doğru',stats.correct],['Toplam Yanlış',stats.wrong],['Başarı Oranı',rate+'%'],['Çalışılan Kelime',studied],['Yanlış Havuzu',wrongPool]];el('statsGrid').innerHTML=items.map(([a,b])=>`<div class="stat"><b>${b}</b><span>${a}</span></div>`).join('');const unitData=new Map();for(const [id,r] of Object.entries(stats.words)){const w=byId.get(id);if(!w)continue;const u=unitData.get(w.unit)||{c:0,t:0};u.c+=r.correct||0;u.t+=(r.correct||0)+(r.wrong||0);unitData.set(w.unit,u)}const rows=[...unitData.entries()].filter(([,v])=>v.t>0).sort((a,b)=>a[0]-b[0]);el('unitList').innerHTML=rows.length?rows.map(([u,v])=>{const p=Math.round(v.c/v.t*100);return `<div class="unit-row"><span>Ünite ${u}</span><div class="bar"><i style="width:${p}%"></i></div><b>%${p}</b></div>`}).join(''):'<div class="empty">Henüz ünite verisi yok.</div>'}
function openStats(from){app.returnScreen=from;renderStats();show('stats')}
el('startBtn').addEventListener('click',start);el('statsBtn').addEventListener('click',()=>openStats(document.querySelector('.screen.active')?.id||'home'));el('quitBtn').addEventListener('click',()=>show('home'));el('backBtn').addEventListener('click',()=>show(app.returnScreen==='quiz'?'quiz':'home'));el('homeBtn').addEventListener('click',()=>show('home'));el('resetBtn').addEventListener('click',()=>{if(confirm('Tüm çalışma istatistikleri kalıcı olarak silinsin mi?')){localStorage.removeItem(KEY);stats={words:{},total:0,correct:0,wrong:0};renderStats()}});
(function init(){el('startUnit').min=minUnit;el('startUnit').max=maxUnit;el('endUnit').min=minUnit;el('endUnit').max=maxUnit;let p={s:minUnit,e:maxUnit,mode:'all'};try{p={...p,...JSON.parse(localStorage.getItem(PREF))}}catch{}el('startUnit').value=p.s;el('endUnit').value=p.e;const m=document.querySelector(`input[name=mode][value="${p.mode}"]`);if(m)m.checked=true;el('dataInfo').textContent=`${WORDS.length.toLocaleString('tr-TR')} kelime • ${minUnit}–${maxUnit} ünite • çevrimdışı hazır`;document.addEventListener('visibilitychange',()=>{if(document.hidden)saveStats()})})();
</script>
</body>
